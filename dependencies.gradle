// See FluxLite's dependencies.gradle for what each configuration means.
dependencies {
    // GTNH 2.8.4 ships gregtech-5.09.51.482; GT pulls in GTNHLib, StructureLib, ModularUI and NEI
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.482:dev") {
        // pulls a CodeChickenLib version that is not published anywhere
        exclude(group: "com.github.GTNewHorizons", module: "ThaumicTinkerer")
    }
    compileOnly("com.github.GTNewHorizons:waila:1.8.14:dev") { transitive = false }
    // Optional mods, each behind its own module package (com.fluxecho.bees / .thaumcraft / .blood / .mobs / .mana /
    // .crops / .ae); IsolationTest fails the build when a class outside that package refers to them. Versions are
    // the ones GTNH 2.8.4 ships.
    compileOnly("com.github.GTNewHorizons:ForestryMC:4.10.17:dev") { transitive = false }
    compileOnly("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:BloodMagic:1.7.52:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Mobs-Info:0.5.6-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Botania:1.12.28-GTNH:dev") { transitive = false }
    // IC2 (com.fluxecho.crops) and AE2 (com.fluxecho.ae) come with GT's own dependencies
    // Quest injection (com.fluxecho.quest.bq) only
    compileOnly("com.github.GTNewHorizons:BetterQuesting:3.7.15-GTNH:dev") { transitive = false }

    // NEI's recipe handler classes touch LWJGL when they load; the NEI tests construct our handlers
    testRuntimeOnly("org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209")
}
