# Configuration file

~CONFIG_VERSION: 0.15.0

##########################################################################################################
# ae2
#--------------------------------------------------------------------------------------------------------#
# Applied Energistics 2: the Echo ME Provider.
##########################################################################################################

ae2 {
    # Switch the Echo ME Provider off: no recipe, and placed ones offer no patterns. [default: true]
    B:enabled=true
}


##########################################################################################################
# bees
#--------------------------------------------------------------------------------------------------------#
# Bees (Forestry): imprint a real bee once, then incubate pristine princesses and drones of it; take gene samples of single traits and put them together into the bee you want.
##########################################################################################################

bees {
    # EU/t of the Gene Assembler (LV). [range: 1 ~ 32, default: 16]
    I:assembleEuPerTick=16

    # Ticks the Gene Assembler takes per job. [range: 1 ~ 72000, default: 100]
    I:assembleTicks=100

    # Butterflies in a batch from a butterfly imprint. [range: 1 ~ 64, default: 1]
    I:butterfliesPerBatch=1

    # Drones in a drone batch (circuit 2). [range: 1 ~ 64, default: 16]
    I:dronesPerBatch=16

    # Drones that come with a princess. [range: 0 ~ 64, default: 2]
    I:dronesWithPrincess=2

    # Switch the module off: no recipes, no NEI pages, and placed machines stop working (they stay in the world). [default: true]
    B:enabled=true

    # Forestry fertilizer per batch of saplings from a tree imprint. [range: 0 ~ 64, default: 4]
    I:fertilizerPerSaplings=4

    # Honey drops per batch of butterflies from a butterfly imprint. [range: 0 ~ 64, default: 8]
    I:honeyPerButterfly=8

    # Honey drops per drone batch (circuit 2). [range: 0 ~ 64, default: 16]
    I:honeyPerDrones=16

    # Honey drops per princess batch (circuit 1: a princess and her drones). [range: 0 ~ 64, default: 12]
    I:honeyPerPrincess=12

    # EU/t of the Bee Imprinter (LV). [range: 1 ~ 32, default: 16]
    I:imprintEuPerTick=16

    # Ticks the Bee Imprinter takes per imprint. [range: 1 ~ 72000, default: 100]
    I:imprintTicks=100

    # EU/t of the Larva Incubator (LV). [range: 1 ~ 32, default: 24]
    I:incubateEuPerTick=24

    # Ticks the Larva Incubator takes per batch. [range: 1 ~ 72000, default: 200]
    I:incubateTicks=200

    # Saplings in a batch from a tree imprint. [range: 1 ~ 64, default: 4]
    I:saplingsPerBatch=4
}


##########################################################################################################
# bloodmagic
#--------------------------------------------------------------------------------------------------------#
# Blood Magic: LP from EU and a little meat, as fast as the bound blood orb you made in the altar allows.
##########################################################################################################

bloodmagic {
    # How far up and down the Blood Echo looks for an altar. [range: 1 ~ 32, default: 10]
    I:altarHeight=10

    # How far sideways the Blood Echo looks for an altar (like the Well of Suffering). [range: 1 ~ 16, default: 5]
    I:altarRange=5

    # Switch the module off: no recipes, and placed machines stop working (they stay in the world). [default: true]
    B:enabled=true

    # EU per LP. [range: 1 ~ 1000, default: 2]
    I:euPerLp=2

    # LP one piece of raw meat or rotten flesh is worth. [range: 1 ~ 1000000, default: 2000]
    I:lpPerMeat=2000

    # LP per tick for blood orbs of level 1 (weak) to 6 (transcendent); higher levels use the last entry. The Blood Echo is an MV machine: keep rate x euPerLp at 128 or below. [default: [4], [8], [16], [32], [48], [64]]
    S:lpPerTick <
        4
        8
        16
        32
        48
        64
     >
}


##########################################################################################################
# botania
#--------------------------------------------------------------------------------------------------------#
# Botania: the Mana Echo Spring draws the echo of mana up from the flux layer with EU and a few petals, into the mana pools around it. The circuit in its core (LV to LuV) sets its tier: each tier draws 4x the mana of the one below, for 4x the EU, and a petal is worth 4x as much.
##########################################################################################################

botania {
    # Switch the module off: no recipes, and placed machines stop working (they stay in the world). [default: true]
    B:enabled=true

    # EU per mana. [range: 1 ~ 10000, default: 2]
    I:euPerMana=2

    # Blocks within which a spring's hologram shows (each spring's is off until switched on in its GUI or with a screwdriver). Client side; 0 turns them all off. [range: 0 ~ 64, default: 16]
    I:hologramRange=16

    # Mana one mystical petal is worth with an LV core (x4 per tier above, so petals go at the same pace at every tier). [range: 1 ~ 10000000, default: 1250]
    I:lvManaPerPetal=1250

    # Mana per tick with an LV core (x4 per tier above). With euPerMana 2 the default uses each tier's full voltage at 1 A. [range: 1 ~ 10000, default: 16]
    I:lvManaPerTick=16

    # How far up and down it reaches with an LV core (one more every second tier above). [range: 0 ~ 16, default: 2]
    I:poolHeight=2

    # How far sideways the spring reaches pools with an LV core (one more per tier above). [range: 1 ~ 16, default: 4]
    I:poolRange=4
}


##########################################################################################################
# codex
#--------------------------------------------------------------------------------------------------------#
# The Echo Codex and the tooltip lines.
##########################################################################################################

codex {
    # Client: a line under bees, seed bags, phials, ... saying whether your team has done it once (NEI shows it too). [default: true]
    B:tooltipHints=true
}


##########################################################################################################
# crops
#--------------------------------------------------------------------------------------------------------#
# Crops (IC2 and Crops++): imprint a fully scanned seed bag once, then get seed bags of it with its stats.
##########################################################################################################

crops {
    # Switch the module off: no recipes, and placed machines stop working (they stay in the world). [default: true]
    B:enabled=true

    # EU/t of the Seed Imprinter (LV). [range: 1 ~ 32, default: 16]
    I:imprintEuPerTick=16

    # Ticks the Seed Imprinter takes per imprint. [range: 1 ~ 72000, default: 100]
    I:imprintTicks=100

    # EU/t of the Seed Echo (LV). [range: 1 ~ 32, default: 24]
    I:seedEuPerTick=24

    # Ticks the Seed Echo takes per seed bag. [range: 1 ~ 72000, default: 200]
    I:seedTicks=200

    # Crop sticks per seed bag. [range: 0 ~ 64, default: 1]
    I:sticksPerSeed=1
}


##########################################################################################################
# effects
#--------------------------------------------------------------------------------------------------------#
# How the echo machines show their work in the world: an effect above each while it works, trails to what the Mana Echo Spring, the Blood Echo and a pedestal's wireless module fill, and their holograms.
##########################################################################################################

effects {
    # Client: blocks within which they show. [range: 0 ~ 128, default: 32]
    I:effectRange=32

    # Client: a trail from the Mana Echo Spring to each mana pool it fills, from the Blood Echo to its altar, and from a Flux Vis Pedestal to each player its wireless module charges. [default: true]
    B:flowTrails=true

    # Blocks within which an echo machine's hologram shows (each one's is off until switched on in its GUI or with a screwdriver on its side). 0 turns them all off. [range: 0 ~ 64, default: 16]
    I:hologramRange=16

    # Client: an effect above an echo machine while it works (rings, motes, sparks in its colour). [default: true]
    B:machineEffects=true
}


##########################################################################################################
# gates
#--------------------------------------------------------------------------------------------------------#
# Light gates (prototype): each gate opens onto a room of its own, closed all round, in the folded zone of the gate's own dimension (past x and z 1048576, where nothing generates). Close to a gate you see into it; walking through is a step within the same world, nothing reloads.
##########################################################################################################

gates {
    # Dimension id of the 0.8.1 prototype's flux interior. Rooms are no longer made there; it stays registered so worlds from 0.8.1 load, and its gates are moved into the folded zone. [range: -100000 ~ 100000, default: 7270]
    I:dimensionId=7270

    # Register the crafting recipe of the light gate. [default: true]
    B:enableRecipe=true

    # While a player is inside a room, keep everything they had loaded round the gate outside loaded for them (and running), so walking back out reloads nothing. Off: only what the room's gate shows stays. [default: true]
    B:holdBase=true

    # Client: draw what lies behind a gate on its membrane. Off: the membrane only glows (for weak graphics cards or a shader pack it does not get along with). [default: true]
    B:liveView=true

    # World provider id of the 0.8.1 prototype's flux interior; only when another mod takes it. [range: -100000 ~ 100000, default: 7270]
    I:providerId=7270

    # Client, with Angelica: walking through a gate is seamless, the far side built before you step in. Without a shader pack the game also draws the world a second time from the far side of each gate in sight, so the membrane shows everything there (machines, mobs, players, holograms, weather); that costs about one more frame's drawing while a gate is in sight. With a shader pack the gate keeps the simpler view (blocks, machines, mobs and FluxEcho's holograms, without the pack's lighting). Off: the 0.8.2 behaviour, with a ripple when walking through. [default: true]
    B:realView=true

    # Blocks within which players see through a gate. The far side is kept loaded for them a little further out, so it is there before they look. 0 turns the view off for everyone. [range: 0 ~ 64, default: 32]
    I:viewRange=32
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Settings shared by every module.
##########################################################################################################

general {
    # Register the crafting recipes of the machines; switch off to write your own with CraftTweaker. [default: true]
    B:enableDefaultRecipes=true

    # First of the 40 GT machine ids FluxEcho keeps (24530-24569 by default). Change it only for a new world or when another mod takes these ids. [range: 1 ~ 32000, default: 24530]
    I:firstMachineId=24530
}


##########################################################################################################
# mobs
#--------------------------------------------------------------------------------------------------------#
# Prey (needs MobsInfo): take an imprint of a mob you killed yourself, then the Prey Echo drops its loot from EU.
##########################################################################################################

mobs {
    # Let the Prey Echo repeat bosses (the Wither, Twilight Forest bosses, ...) you killed yourself. [default: true]
    B:allowBosses=true

    # A boss costs this many times the EU (and time) of a mob with its health. [range: 1 ~ 100000, default: 50]
    I:bossMultiplier=50

    # Drops the Prey Echo never makes, as modid:name or modid:name:damage. [default: [minecraft:skull:1]]
    S:dropBlacklist <
        minecraft:skull:1
     >

    # Switch the module off: no recipes, and placed machines stop working (they stay in the world). [default: true]
    B:enabled=true

    # EU per point of the mob's max health, per kill. The Prey Echo is an LV machine; a kill never takes less than minTicks. [range: 1 ~ 1000000, default: 128]
    I:euPerHealth=128

    # Shortest time of one kill, in ticks. [range: 1 ~ 72000, default: 200]
    I:minTicks=200
}


##########################################################################################################
# nexus
#--------------------------------------------------------------------------------------------------------#
# The Flux Nexus (from HV): the flux materials, the nexus itself, its research and the modules docked on its rings. Energy comes from the owner's team wireless network.
##########################################################################################################

nexus {
    # The Echo Archive, the walk-in library the campus builder raises once the library is researched. Off: no Archive is projected or built, and a library forms only as the 0.9.2 hall. [default: true]
    B:archiveEnabled=true

    # Client: the most launch arcs drawn at once. [range: 0 ~ 512, default: 48]
    I:buildArcs=48

    # Blocks the campus builder never breaks, as modid:name or modid:* for a whole mod; it goes round them (or waits, for a cell of a building). [default: ]
    S:buildBlocked <
     >

    # Blocks the campus builder launches per tick, on average (some stages go faster or slower). Each costs buildEuPerBlock EU.
    D:buildBlocksPerTick=2.0

    # The campus builder empties every cell it clears or builds in, natural or not, machines, chests and other tile entities included (their contents go to the recycle store, see buildKeepSpoils). It still never touches another campus, a module or another structure, unbreakable blocks, the buildBlocked list, or what a protection mod refuses. Off: the cautious rule of 0.10.0, which only clears natural terrain and ores and leaves anything a player may have built (marked red). [default: true]
    B:buildClearAll=true

    # How high above the campus floor the builder clears (hills, trees, and with buildClearAll everything else in the way) when it grades the campus. A building's own box is always cleared to its full height. [range: 0 ~ 64, default: 24]
    I:buildClearHeight=24

    # Blocks the campus builder clears or fills per tick where it grades the ground and makes room for a building (what it may clear: see buildClearAll). [range: 1 ~ 256, default: 8]
    I:buildClearPerTick=8

    # Blocks the campus builder may clear even if it would not count them as natural terrain, as modid:name or modid:* for a whole mod. [default: ]
    S:buildClearable <
     >

    # Multiplies the materials every block the campus builder places costs (the same as its crafting recipe at 1). 0 makes everything free, the Crystal Seat and the Echo Library Core included.
    D:buildCostScale=1.0

    # Client: draw the builder at work (the arcs from the core to each block it places, the blocks printing in, the ground it clears breaking up) and the light rising over the campus's light wells. [default: true]
    B:buildEffects=true

    # EU the campus builder draws from the owner's team wireless network for each block it places. [range: 0 ~ 2147483647, default: 256]
    I:buildEuPerBlock=256

    # EU it draws for each natural block it clears, and for each cell of ground it fills with grass or dirt. [range: 0 ~ 2147483647, default: 64]
    I:buildEuPerClear=64

    # How deep below the campus floor the builder fills when it grades: from just under the floor down this far, air, water, plants, logs and leaves become dirt (lava too when buildClearAll is on), stopping at the first solid block; whatever lies deeper stays under that crust. The floor itself becomes grass wherever the campus is not paved. [range: 0 ~ 16, default: 4]
    I:buildFillDepth=4

    # Client: the most ghost blocks the projection draws (the nearest first). [range: 0 ~ 100000, default: 6000]
    I:buildGhostCells=6000

    # Client: blocks within which the projection draws its ghost blocks; further away only outlines. [range: 0 ~ 256, default: 96]
    I:buildGhostRange=96

    # Keep what the campus builder takes down: the drops of every block it clears and the contents of the chests and machines it dismantles go to the nexus's recycle store (taken out at the recycle bin or with Withdraw). Off: they are voided; our own campus blocks are still credited to the build. [default: true]
    B:buildKeepSpoils=true

    # Blocks (along x or z) a new nexus core placed on the ground must keep from the centre of another nexus's campus, so two campuses never overlap: 312 leaves room for both campuses' outer rings. A core put back where it stood, and an older nexus laying its forum, keep only the old 144 (their outer rings share the ground between them). 0 turns the check off. [range: 0 ~ 100000, default: 312]
    I:buildMinSpacing=312

    # Client: how a build job's projection is drawn: full (the blocks to come, as ghosts), outline (only their outline) or off. [default: full]
    S:buildProjection=full

    # A nexus core placed on the ground needs open sky above it (no building it underground or under a roof). [default: true]
    B:buildRequireSky=true

    # The campus builder: a nexus core placed on the ground (not sneaking) builds the nexus round itself, grades and paves its campus, and builds the modules its teams research (the Echo Archive) from the materials and EU it is given, once a member presses Start. Off: nothing is built or touched and no campus is made (a core clicked on the ground still goes two blocks up, but it is a nexus to build by hand, as in 0.9.2). [default: true]
    B:campusEnabled=true

    # Flux compute a formed, powered nexus produces each second (phase I); research runs on it. [range: 0 ~ 1000000, default: 20]
    I:computePerSecond=20

    # Flux grit per flux crystal in GT's autoclave. [range: 1 ~ 64, default: 3]
    I:crystalGrit=3

    # Client: blocks within which a formed nexus and its modules are drawn. [range: 16 ~ 512, default: 128]
    I:effectRange=128

    # Client: draw the formed nexus and its modules (floating rings, light column, bridges, the library's depths). Off: the bare blocks. [default: true]
    B:effects=true

    # Switch the nexus and its modules off: no recipes, and placed ones stop working (they stay in the world). The flux materials stay. [default: true]
    B:enabled=true

    # Chance that a Flux Shard Collector gives off one flux grit with each ore it condenses (0-1). The only source of flux grit.
    D:gritChance=0.15

    # Blocks from the nexus's centre to the centre of each inner ring slot. Changing it moves the slots of nexuses already built. [range: 12 ~ 128, default: 32]
    I:innerRingRadius=32

    # EU/t an Echo Library draws while it is docked on a nexus. [range: 0 ~ 2147483647, default: 128]
    I:libraryUpkeepEuPerTick=128

    # EU/t the nexus's manifestation table draws on top of the upkeep while it makes something. [range: 1 ~ 2147483647, default: 480]
    I:manifestEuPerTick=480

    # EU/t a city module the nexus built (the Eco Dome and the modules after it) draws while it is docked on a nexus. Without it the module stands unpowered; what its units hold stays. [range: 0 ~ 2147483647, default: 128]
    I:moduleUpkeepEuPerTick=128

    # Ticks before the same Echo Codex entry can be pressed into an echo crystal again (24000 = one day). [range: 0 ~ 2147483647, default: 24000]
    I:recordCooldownTicks=24000

    # Multiplies the compute every research takes (0.1 = ten times faster).
    D:researchCostScale=1.0

    # EU/t a formed nexus draws from its owner's team wireless network to stay anchored (phase I). [range: 0 ~ 2147483647, default: 512]
    I:upkeepEuPerTick=512
}


##########################################################################################################
# quests
#--------------------------------------------------------------------------------------------------------#
# FluxEcho's quest lines for BetterQuesting.
##########################################################################################################

quests {
    # Put FluxEcho's quest lines into every world's quest database when it loads (missing quests added, changed ones updated, progress kept), and copy them into config/betterquesting/DefaultQuests and QuestLinesOrder.txt at startup so /bq_admin default load keeps them. Other quest lines are never touched. [default: true]
    B:install=true
}


##########################################################################################################
# thaumcraft
#--------------------------------------------------------------------------------------------------------#
# Thaumcraft: aspects your team has held once (a phial, a jar, a crystal, a shard) are synthesized from EU; wands are charged from EU with the primals you know.
##########################################################################################################

thaumcraft {
    # Switch the module off: no recipes, and placed machines and outlets stop working (they stay in the world). [default: true]
    B:enabled=true

    # EU per primal unit of synthesized essentia. A primal is 1 unit, a compound the sum of its components (Lux = 2, Permutatio = 3, ...). [range: 1 ~ 1000000, default: 128]
    I:essentiaEuPerUnit=128

    # Primal units of essentia one vis crystal shard pays for (any shard, the balanced one too). [range: 1 ~ 100000, default: 64]
    I:essentiaUnitsPerShard=64

    # Centivis per primal per tick each extraction module adds (they add up, up to 4). [range: 0 ~ 100000, default: 50]
    I:extractionModuleCentivisPerTick=50

    # Blocks within which the Flux Vis Pedestal shows its status hologram (power, modules, the wand's vis). Client side; 0 turns it off. [range: 0 ~ 64, default: 12]
    I:hologramRange=12

    # EU/t of the Insight Echo (LV). [range: 1 ~ 32, default: 16]
    I:insightEuPerTick=16

    # Ticks the Insight Echo takes to give the owner a scanned item's research points again (one paper each). [range: 1 ~ 72000, default: 200]
    I:insightTicks=200

    # Most EU/t the link module draws from the team's GT wireless network (FluxLite's network) into the pedestal. [range: 1 ~ 2147483647, default: 32768]
    I:linkModuleEuPerTick=32768

    # EU the Flux Vis Pedestal stores. [default: 4000000]
    S:pedestalBufferEU=4000000

    # Centivis per primal per tick the Flux Vis Pedestal draws with no extraction module (25 = 5 vis a second). [range: 1 ~ 100000, default: 25]
    I:pedestalCentivisPerTick=25

    # EU per centivis the Flux Vis Pedestal puts into a wand (100 centivis = 1 vis; 10 = 1000 EU per vis, about 1500 EU/t with all six primals filling and no module). [range: 1 ~ 1000000, default: 10]
    I:pedestalEuPerCentivis=10

    # Blocks within which the wireless module fills the wands, sceptres, staves and vis amulets the team carries. [range: 1 ~ 512, default: 32]
    I:wirelessModuleRange=32
}


